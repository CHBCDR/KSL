name: Build KSL

# 云编译流水线：真机 config.gz + MT6771 4.14 源码树 → ksu_lkm_tp.ko
# 注意：本版本从仓库根目录的 config.gz 解压出 .config（绕开网页上传隐藏文件限制）
# 源码树：techyminati/android_kernel_realme_mt6771V（分支 lineage-18.1-rmui，完整树，4.14.142）
#   —— Hadenix/kernel_umidigi_f2_mt6771_4.14 是残缺树（缺 Kconfig），不能用
# 对齐 Android 官方 4.14 构建方式（build.config.mtk.aarch64）：
#   CC=clang (NDK r21e, clang 9.0.8, 与设备 clang 9.0.3 同代)
#   CROSS_COMPILE=GNU binutils (Ubuntu gcc-aarch64-linux-gnu 提供 as/objcopy)
#   LD=ld.lld
# 触发：push 或 Actions 页手动 Run workflow
# 产物：Actions 页下载 artifact (ksu-lkm)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source (MT6771 4.14, 完整树)
        run: |
          git clone --depth 1 -b lineage-18.1-rmui \
            https://github.com/techyminati/android_kernel_realme_mt6771V.git kernel

      - name: Setup toolchain (GNU binutils + NDK clang 9.0.8)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "NDK=$GITHUB_WORKSPACE/android-ndk-r21e" >> $GITHUB_ENV

      - name: Prepare kernel (真机 config + modules_prepare)
        run: |
          gzip -dc $GITHUB_WORKSPACE/config.gz > kernel/.config
          cd kernel
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               olddefconfig
          make ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               modules_prepare
          # 真机版本号 4.14.141+ vs 源码树 4.14.142 → 强制对齐 vermagic，否则 Exec format error
          sed -i 's/^#define UTS_RELEASE .*/#define UTS_RELEASE "4.14.141+"/' include/generated/utsrelease.h
          echo "=== utsrelease.h after sed ==="
          grep UTS_RELEASE include/generated/utsrelease.h

      - name: Build LKM (ksu_lkm_sct.ko)
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make KERNELDIR=$GITHUB_WORKSPACE/kernel ARCH=arm64 \
               CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               all
          # 不在这里动 __versions：kload v4 加载时会把该段改名来跳过 CRC
          # （objcopy 删段在 GNU/llvm 上行为不一致且会报错，放弃该路线）
          echo "=== ko sections (expect __versions present, kload renames at load) ==="
          aarch64-linux-gnu-readelf -S ksu_lkm_sct.ko | grep -E '__versions|\.modinfo'
          echo "=== vermagic inside .modinfo ==="
          aarch64-linux-gnu-objdump -s -j .modinfo ksu_lkm_sct.ko | grep -a vermagic || true

      - name: Build kload (finit_module loader, arm64 static)
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          clang --target=aarch64-linux-android21 -static -O2 \
            $GITHUB_WORKSPACE/kload.c -o kload
          file kload || true

      - name: Build ksu_su (lightweight su frontend, arm64 static)
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          clang --target=aarch64-linux-android21 -static -O2 \
            $GITHUB_WORKSPACE/ksu_su.c -o ksu_su
          file ksu_su || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-lkm
          path: |
            *.ko
            kload
            ksu_su
          if-no-files-found: error
