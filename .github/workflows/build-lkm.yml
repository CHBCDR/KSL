name: Build KSU LKM

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source (MT6771 4.14, 完整树)
        run: |
          git clone --depth 1 -b lineage-18.1-rmui \
            https://github.com/techyminati/android_kernel_realme_mt6771V.git kernel

      - name: Setup toolchain (GNU binutils + NDK clang 9.0.8)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "NDK=$GITHUB_WORKSPACE/android-ndk-r21e" >> $GITHUB_ENV

      - name: Prepare kernel (真机 config + modules_prepare + vermagic 对齐)
        run: |
          gzip -dc $GITHUB_WORKSPACE/config.gz > kernel/.config
          cd kernel
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               olddefconfig
          make ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               modules_prepare
          sed -i 's/^#define UTS_RELEASE .*/#define UTS_RELEASE "4.14.141+"/' include/generated/utsrelease.h
          grep UTS_RELEASE include/generated/utsrelease.h

      - name: Build LKM (ksu_lkm_sct.ko, 删 __versions 绕过 MODVERSIONS)
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          make KERNELDIR=$GITHUB_WORKSPACE/kernel ARCH=arm64 \
               CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
               CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
               all
          # 删 __versions 段 → 内核完全跳过 MODVERSIONS CRC 检查；
          # vermagic 保留（sed 已对齐 4.14.141+），init_module 严格检查也能过。
          # GNU objcopy 删段会因符号表残留 __versions 符号报错，优先 llvm-objcopy
          llvm-objcopy --remove-section __versions --strip-symbol __versions \
            ksu_lkm_sct.ko ksu_lkm_sct.nov.ko 2>/dev/null \
            || aarch64-linux-gnu-objcopy --remove-section __versions --strip-symbol __versions \
               ksu_lkm_sct.ko ksu_lkm_sct.nov.ko
          mv -f ksu_lkm_sct.nov.ko ksu_lkm_sct.ko
          echo "=== sections check (__versions should be gone) ==="
          aarch64-linux-gnu-readelf -S ksu_lkm_sct.ko | grep -E '__versions' \
            && echo "WARN: __versions still present!" \
            || echo "OK: no __versions section"

      - name: Build kload (finit_module loader, arm64 static)
        run: |
          export PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          clang --target=aarch64-linux-android21 -static -O2 \
            $GITHUB_WORKSPACE/kload.c -o kload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ksu-lkm
          path: |
            *.ko
            kload
          if-no-files-found: error
